name: Flutter CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter 3.35.6 (как рекомендует ошибка)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'  # ← ТОЧНАЯ ВЕРСИЯ ИЗ ОШИБКИ
        channel: 'stable'
    
    - name: Verify versions
      run: |
        echo "=== Flutter Version ==="
        flutter --version
        echo "=== Dart Version ==="
        dart --version
